# No Render, conecte o repositório como um Blueprint para usar estes valores.
services:
  - type: web
    name: cognit
    runtime: static
    buildCommand: pip install -r requirements-web.txt && python exportar_web.py
    staticPublishPath: jogo/build/web
    envVars:
      - key: SKIP_INSTALL_DEPS
        value: "true"
