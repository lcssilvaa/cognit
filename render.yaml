# No Render, conecte o repositório como um Blueprint para usar estes valores.
services:
  - type: web
    name: cognit
    runtime: static
    buildCommand: pip install -r requirements-web.txt && python exportar_web.py
    staticPublishPath: jogo/build/web
    envVars:
      - key: SKIP_INSTALL_DEPS
        value: "true"
      - key: COGNIT_SERVIDOR
        value: https://cognit-server.onrender.com
  - type: web
    name: cognit-server
    runtime: python
    plan: free
    numInstances: 1
    buildCommand: python --version
    startCommand: python -u servidor.py --host 0.0.0.0 --port $PORT
    healthCheckPath: /saude
