# No Render, conecte o repositório como um Blueprint para usar estes valores.
services:
  - type: web
    name: cognit
    runtime: python
    plan: free
    numInstances: 1
    buildCommand: pip install -r requirements-web.txt && python exportar_web.py
    startCommand: python servidor.py
    healthCheckPath: /saude
    envVars:
      - key: SKIP_INSTALL_DEPS
        value: "true"
